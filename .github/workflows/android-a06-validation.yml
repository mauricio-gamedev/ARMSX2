name: Android A06 Baseline Validation
run-name: A06 Android baseline on ${{ github.ref_name }}

on:
  push:
    branches:
      - optimal/a06-baseline-validation
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-a06-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-apk:
    name: Android ARM64 APK
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    defaults:
      run:
        working-directory: platforms/android
    steps:
      - name: Checkout source and submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install pinned NDK and CMake
        run: yes | sdkmanager "ndk;29.0.14206865" "cmake;3.31.6" >/dev/null

      - name: Fetch shaderc third-party dependencies
        run: python3 app/src/main/cpp/3rdparty/shaderc/utils/git-sync-deps

      - name: Install Rust Android target
        run: rustup target add aarch64-linux-android

      - name: Build Android release APK
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Upload generated APKs
        uses: actions/upload-artifact@v7
        with:
          name: armsx2-a06-baseline-apk
          path: platforms/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
